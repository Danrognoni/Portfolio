<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Dante Rognoni — Desarrollador Full Stack · ByCode</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Soy Dante Rognoni, desarrollador Full Stack e integrante del equipo de ByCode. Conocé DoctorChart, Pointly y mis proyectos con Go, Angular, Java y PostgreSQL."
    />
    <meta name="theme-color" content="#f8f7f3" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('portfolio-theme');
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171b18' : '#f8f7f3';
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dante Rognoni — Full Stack Developer · ByCode" />
    <meta
      property="og:description"
      content="Ideas claras. Software que hace la diferencia. DoctorChart, Pointly y experiencias web con identidad propia."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="assets/img/dr-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
